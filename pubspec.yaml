name: shelf_scanner_ai
description: AI supermarket shelf & product detection (Flutter + ONNX Runtime).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  video_player: ^2.8.0
  gal: ^2.3.0
  provider: ^6.1.0
  image_picker: ^1.0.0
  permission_handler: ^11.3.1
  onnxruntime: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/models/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo1.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo1.png"

  min_sdk_android: 21
  remove_alpha_ios: true